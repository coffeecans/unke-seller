<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>UNKE Seller Notebook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="app container-fluid py-3">
    <header class="sticky-top pt-2 pb-2 bg-body">
      <h1 class="h4 fw-bold mb-3">Продажи продавца</h1>
      <div class="btn-group w-100" role="group" aria-label="tabs">
        <button id="tab-cart" class="btn btn-dark">Корзина</button>
        <button id="tab-sales" class="btn btn-outline-dark">Продажи</button>
      </div>
    </header>

    <section id="view-cart" class="view mt-3">
      <div class="card border-0 shadow-sm mb-3">
        <div class="card-body">
          <label class="form-label fw-semibold">Поиск товара (мультиселект + саджест)</label>
          <div class="input-group mb-2">
            <input id="catalog-search" class="form-control" placeholder="Начните вводить название модели" autocomplete="off" />
            <button id="refresh-catalog" class="btn btn-outline-secondary">Обновить каталог</button>
          </div>
          <div id="catalog-status" class="small text-secondary"></div>
          <div id="catalog-suggestions" class="list-group mt-2"></div>
          <div id="catalog-empty" class="alert alert-warning py-2 px-3 mt-2 d-none"></div>
        </div>
      </div>

      <h2 class="h6 text-uppercase text-secondary mt-3">Корзина</h2>
      <div class="table-responsive no-horizontal-scroll">
        <table class="table table-sm table-bordered align-middle" id="cart-table">
          <thead class="table-light"><tr><th>Товар</th><th>Кол-во</th><th>Размер</th><th>Цвет</th><th>Цена</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="card border-0 shadow-sm mb-2">
        <div class="card-body">
          <label class="form-label">Заметка</label>
          <textarea id="sale-note" class="form-control" rows="2" placeholder="Например: постоянный клиент, бронь до вечера"></textarea>
          <label class="form-label mt-3">Фото товара</label>
          <input id="sale-photo" class="form-control" type="file" accept="image/*" />
        </div>
      </div>
    </section>

    <section id="view-sales" class="view mt-3 d-none">
      <div class="card border-0 shadow-sm mb-3">
        <div class="card-body">
          <div class="row g-2">
            <div class="col-7"><input id="sales-date" type="date" class="form-control" /></div>
            <div class="col-5"><button id="export-btn" class="btn btn-success w-100">Excel</button></div>
          </div>
          <input id="sales-search" class="form-control mt-2" placeholder="Поиск по продажам" />
          <div id="day-total" class="mt-2 fw-bold"></div>
        </div>
      </div>
      <div class="table-responsive no-horizontal-scroll">
        <table class="table table-sm table-bordered" id="sales-table">
          <thead class="table-light"><tr><th>Дата</th><th>Товары</th><th>Скидка</th><th>Итог</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <footer id="cart-summary" class="card border-0 shadow-lg">
      <div class="card-body py-2">
        <div class="d-flex justify-content-between"><span>Сумма:</span><b id="total-before">0 ₽</b></div>
        <div class="mt-2"><label class="form-label mb-1">Скидка %</label><input id="discount" type="number" min="0" max="100" value="0" class="form-control" /></div>
        <div class="d-flex justify-content-between mt-2"><span>Итого:</span><b id="total-after">0 ₽</b></div>
        <button id="sell-btn" class="btn btn-primary w-100 mt-2">Продать</button>
      </div>
    </footer>
  </main>

  <dialog id="edit-dialog" class="rounded border-0 shadow">
    <form method="dialog" id="edit-form" class="p-3">
      <h3 class="h6">Редактирование продажи</h3>
      <label class="form-label">Дата и время</label><input id="edit-datetime" type="datetime-local" class="form-control mb-2" />
      <label class="form-label">Скидка %</label><input id="edit-discount" type="number" min="0" max="100" class="form-control mb-2" />
      <label class="form-label">Заметка</label><textarea id="edit-note" class="form-control mb-3"></textarea>
      <div class="d-flex justify-content-end gap-2">
        <button value="cancel" class="btn btn-outline-secondary">Отмена</button>
        <button id="save-edit" value="default" class="btn btn-primary">Сохранить</button>
      </div>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
